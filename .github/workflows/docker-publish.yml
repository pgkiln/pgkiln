name: Publish Docker image

# A release tag (v0.31.0, …) builds the image for amd64 and arm64 and pushes it to
# Docker Hub (pgkiln/pgkiln) and the GitHub Container Registry (ghcr.io/pgkiln/pgkiln)
# as 0.31.0, 0.31 and latest. Needs the repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (a Docker Hub access token with read & write).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            pgkiln/pgkiln
            ghcr.io/pgkiln/pgkiln
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=pgkiln
            org.opencontainers.image.description=Low-code application builder for PostgreSQL
            org.opencontainers.image.url=https://pgkiln.vargar.eu
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Vargar

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the Docker Hub page shows the README (its links point to GitHub and the website)
      - uses: peter-evans/dockerhub-description@v5
        # needs a token with read, write & delete; a read & write token only skips this step
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pgkiln/pgkiln
          short-description: Low-code application builder for PostgreSQL, an alternative to Oracle APEX
          readme-filepath: ./README.md
          enable-url-completion: true
