name: Docker Hub description

# Keeps the Docker Hub page of pgkiln/pgkiln in step with README.md (also run by hand).
# Needs DOCKERHUB_TOKEN with read, write & delete (Docker Hub requires that to edit a page).
on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub-readme.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pgkiln/pgkiln
          short-description: Low-code application builder for PostgreSQL, an alternative to Oracle APEX
          readme-filepath: ./README.md
          enable-url-completion: true
