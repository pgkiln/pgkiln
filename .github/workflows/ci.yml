name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same pull request cancels the run before it (no mail about a run nobody waits for)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgkiln
          POSTGRES_PASSWORD: pgkiln
          POSTGRES_DB: pgkiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgkiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # LDAP sign-in tests (test/ldap.test.ts adds the entries it needs)
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Example
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: admin
        ports:
          - 3890:389
    env:
      DATABASE_URL: postgres://pgkiln:pgkiln@localhost:5432/pgkiln
      RUNTIME_DATABASE_URL: postgres://pgkiln_runtime:pgkiln_runtime@localhost:5432/pgkiln
      # test-only secret for the REST API tokens (src/api.ts needs 32+ characters)
      API_JWT_SECRET: ci-only-api-secret-not-for-production-0123456789
      LDAP_URL: ldap://127.0.0.1:3890
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # services can't pass server options: load pg_stat_statements (Top SQL) with ALTER SYSTEM and a restart
      - name: Load pg_stat_statements
        run: |
          psql "$DATABASE_URL" -c "alter system set shared_preload_libraries = 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 -U pgkiln && break; sleep 1; done
      # Schema Export / Import (test/datapump.test.ts) needs pg_dump and pg_restore of the server's major version:
      # the runner's own are older, so install 17 from the PostgreSQL apt repository (src/datapump.ts finds the newest)
      - name: PostgreSQL 17 client programs
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      # npm test installs the framework and the HR example app (the tests' fixture) first (pretest)
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgkiln
          POSTGRES_PASSWORD: pgkiln
          POSTGRES_DB: pgkiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgkiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pgkiln:pgkiln@localhost:5432/pgkiln
      RUNTIME_DATABASE_URL: postgres://pgkiln_runtime:pgkiln_runtime@localhost:5432/pgkiln
      # test-only secret for the REST API tokens (src/api.ts needs 32+ characters)
      API_JWT_SECRET: ci-only-api-secret-not-for-production-0123456789
      SCREENSHOTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: test-results/

  # Install an older release with its sample data, upgrade to this commit,
  # then run the tests: migrations must work on existing databases too. The whole
  # suite runs after upgrading from the oldest and the newest release; the others
  # run the tests that touch every table (export / import, the CLI, generated apps,
  # sign-in), so 29 copies of the suite don't each get a chance to hit a timing flake.
  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: [v0.31.0, v0.32.0, v0.33.2, v0.34.0, v0.35.0, v0.36.0, v0.37.0, v0.38.0, v0.39.0, v0.40.0, v0.41.0, v0.42.0, v0.43.0, v0.44.0, v0.45.0, v0.46.0, v0.47.0, v0.48.0, v0.49.0, v0.50.0, v0.51.0, v0.52.0, v0.53.0, v0.54.0, v0.55.0, v0.56.0, v0.57.0, v0.58.0, v0.59.0, v0.60.0, v0.61.0, v0.62.0, v0.63.0]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgkiln
          POSTGRES_PASSWORD: pgkiln
          POSTGRES_DB: pgkiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgkiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pgkiln:pgkiln@localhost:5432/pgkiln
      RUNTIME_DATABASE_URL: postgres://pgkiln_runtime:pgkiln_runtime@localhost:5432/pgkiln
      API_JWT_SECRET: ci-only-api-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.from }}
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          # the whole release: its migrations and its HR example
          git archive "${{ matrix.from }}" | tar -x -C "$RUNNER_TEMP/old"
          npx tsx scripts/migrate.ts --seed --root "$RUNNER_TEMP/old"
      - name: Upgrade to this commit
        run: npm run example:hr
      - name: Tests
        run: |
          # the first and the last release of the matrix above
          releases=$(grep -oE 'from: \[[^]]*\]' .github/workflows/ci.yml | grep -oE 'v[0-9.]+')
          if [ "${{ matrix.from }}" = "$(echo "$releases" | head -1)" ] || [ "${{ matrix.from }}" = "$(echo "$releases" | tail -1)" ]; then
            npm test
          else
            npx tsx --test --test-concurrency=1 test/cli.test.ts test/export.test.ts test/generated-apps.test.ts test/builder-home.test.ts test/mfa.test.ts
          fi

  docker:
    # what a user runs: deploy/.env.example filled in, docker compose up -d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start with the example .env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/; s/^RUNTIME_PASSWORD=$/RUNTIME_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^PGKILN_SECRET_KEY=$/PGKILN_SECRET_KEY=$(openssl rand -hex 24)/; s/^PGKILN_ADMIN_PASSWORD=$/PGKILN_ADMIN_PASSWORD=ci-admin-password-0123/" .env
          echo PGKILN_EXAMPLE=hr >> .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Check it
        run: |
          curl -fsS http://127.0.0.1:3100/healthz
          curl -fsS -o /dev/null http://127.0.0.1:3100/a/hr/login
          curl -fsS -o /dev/null http://127.0.0.1:3100/builder/login
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs

  docker-upgrade:
    # what a user runs to upgrade: docker compose pull, then docker compose up -d. An older release stands in for
    # a stale :latest; the pull must replace it (it didn't with pull_policy: missing) and up -d must recreate the
    # container on the new image, which migrates the database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start an older release as :latest
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/; s/^RUNTIME_PASSWORD=$/RUNTIME_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^PGKILN_SECRET_KEY=$/PGKILN_SECRET_KEY=$(openssl rand -hex 24)/; s/^PGKILN_ADMIN_PASSWORD=$/PGKILN_ADMIN_PASSWORD=ci-admin-password-0123/" .env
          echo PGKILN_EXAMPLE=hr >> .env
          docker pull pgkiln/pgkiln:0.50.0
          docker tag pgkiln/pgkiln:0.50.0 pgkiln/pgkiln:latest
          docker compose up -d --wait --wait-timeout 300
      - name: Upgrade with docker compose pull
        working-directory: deploy
        run: |
          old=$(docker image inspect -f '{{.Id}}' pgkiln/pgkiln:0.50.0)
          docker compose pull pgkiln
          new=$(docker image inspect -f '{{.Id}}' pgkiln/pgkiln:latest)
          [ "$new" != "$old" ] || { echo "docker compose pull kept the old image"; exit 1; }
          docker compose up -d --wait --wait-timeout 300
          [ "$(docker inspect -f '{{.Image}}' "$(docker compose ps -q pgkiln)")" = "$new" ] || { echo "the container still runs the old image"; exit 1; }
          curl -fsS http://127.0.0.1:3100/healthz
          curl -fsS -o /dev/null http://127.0.0.1:3100/a/hr/login
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs
