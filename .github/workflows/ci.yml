name: CI

on:
  push:
    branches: [main]
  pull_request:
  # (sprint 208) the full upgrade matrix every night, and on demand (Actions → CI → Run workflow)
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

# a newer push to the same pull request cancels the run before it (no mail about a run nobody waits for); the event
# is in the group so that the nightly run never replaces a pending run of a push to main
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every release the upgrade jobs install and upgrade from, oldest first. Releasing: add the new tag at the end of this
  # line (docs/guide/12-development.md, "Releasing"). The oldest and the newest run the whole suite; a pull request
  # runs the three before the newest too, everything else (main, release-* branches, nightly) all of them.
  UPGRADE_FROM: v0.31.0 v0.32.0 v0.33.2 v0.34.0 v0.35.0 v0.36.0 v0.37.0 v0.38.0 v0.39.0 v0.40.0 v0.41.0 v0.42.0 v0.43.0 v0.44.0 v0.45.0 v0.46.0 v0.47.0 v0.48.0 v0.49.0 v0.50.0 v0.51.0 v0.52.0 v0.53.0 v0.54.0 v0.55.0 v0.56.0 v0.57.0 v0.58.0 v0.59.0 v0.60.0 v0.61.0 v0.62.0 v0.63.0 v0.64.0 v0.65.0 v0.66.0 v0.67.0 v0.68.0 v0.69.0 v0.70.0 v0.71.0 v0.72.0 v0.73.0 v0.74.0 v0.75.0 v0.76.0 v0.77.0 v0.78.0 v0.79.0 v0.80.0 v0.81.0 v0.82.0 v0.83.0 v0.84.0 v0.85.0 v0.86.0 v0.87.0 v0.88.0 v0.89.0 v0.90.0 v0.91.0 v0.92.0 v0.93.0 v0.94.0 v0.95.0 v0.96.0 v0.97.0 v0.98.0 v0.99.0 v0.100.0 v0.101.0 v0.102.0 v0.103.0 v0.104.0 v0.105.0 v0.106.0 v0.107.0 v0.108.0

# (sprint 208) The long suites run in shards (node --test-shard=i/n: every test file runs in exactly one shard), each
# with its own database. The jobs named test, e2e and upgrade (v0.31.0) gather the shards' results: they are the
# required checks of the main branch, so keep their names.
jobs:
  test-shard:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # (sprint 136) with pgvector, for the vector search tests; the upgrade jobs keep postgres:17 (without pgvector)
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pgkiln
          POSTGRES_PASSWORD: pgkiln
          POSTGRES_DB: pgkiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgkiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # LDAP sign-in tests (test/ldap.test.ts adds the entries it needs)
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Example
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: admin
        ports:
          - 3890:389
    env:
      DATABASE_URL: postgres://pgkiln:pgkiln@localhost:5432/pgkiln
      RUNTIME_DATABASE_URL: postgres://pgkiln_runtime:pgkiln_runtime@localhost:5432/pgkiln
      # test-only secret for the REST API tokens (src/api.ts needs 32+ characters)
      API_JWT_SECRET: ci-only-api-secret-not-for-production-0123456789
      LDAP_URL: ldap://127.0.0.1:3890
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.shard == 1
      # services can't pass server options: load pg_stat_statements (Top SQL) and pg_cron (SQL Workshop › Scheduling,
      # installed into the service container: pgvector's image is postgres:17 with PGDG's apt source) with ALTER SYSTEM
      # and a restart; npm run pretest migrates, which creates the extension. The upgrade jobs (postgres:17, no
      # pg_cron) test the Scheduling page without it
      - name: Load pg_stat_statements and pg_cron
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-17-cron > /dev/null'
          psql "$DATABASE_URL" -c "alter system set shared_preload_libraries = pg_stat_statements, pg_cron" -c "alter system set cron.database_name = 'pgkiln'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 -U pgkiln && break; sleep 1; done
      # Schema Export / Import (test/datapump.test.ts) needs pg_dump and pg_restore of the server's major version:
      # the runner's own are older, so install 17 from the PostgreSQL apt repository (src/datapump.ts finds the newest)
      - name: PostgreSQL 17 client programs
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      # npm test, in shards: pretest installs the framework and the HR example app (the tests' fixture), then a third
      # of test/*.test.ts, (sprint 212) balanced by the files' durations (scripts/test-shard.ts, test/durations.json)
      - name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          npm run pretest
          npx tsx --test --test-concurrency=1 $(npx tsx scripts/test-shard.ts ${{ matrix.shard }}/${{ strategy.job-total }} test/*.test.ts)

  test:
    # required check: every shard of test-shard passed
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test-shard.result }}" = success ]'

  e2e-shard:
    # four shards, balanced by the files' durations (scripts/test-shard.ts, test/e2e/durations.json): test/e2e/
    # responsive.ts takes a third of the run, in a file per width (responsive-<width>.test.ts)
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgkiln
          POSTGRES_PASSWORD: pgkiln
          POSTGRES_DB: pgkiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgkiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pgkiln:pgkiln@localhost:5432/pgkiln
      RUNTIME_DATABASE_URL: postgres://pgkiln_runtime:pgkiln_runtime@localhost:5432/pgkiln
      # test-only secret for the REST API tokens (src/api.ts needs 32+ characters)
      API_JWT_SECRET: ci-only-api-secret-not-for-production-0123456789
      SCREENSHOTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # not cached: the browser downloads as fast as a cache restores it, and the system packages aren't cacheable
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          npm run pretest:e2e
          npx tsx --test --test-concurrency=1 $(npx tsx scripts/test-shard.ts ${{ matrix.shard }}/${{ strategy.job-total }} test/e2e/*.test.ts)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.shard }}
          path: test-results/

  e2e:
    # required check: every shard of e2e-shard passed
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.e2e-shard.result }}" = success ]'

  releases:
    # the upgrade jobs' matrices from UPGRADE_FROM: the oldest and the newest release run the whole suite in three
    # shards each; the others run QUICK_TESTS, a batch of releases per job (each on a fresh database, three at a time),
    # so that 70 one-minute jobs don't fill the 20 runners the long shards are waiting for: (sprint 212) at most four
    # batches, which with the 16 other jobs of a full run is 20. A pull request (except a release-* branch) takes only
    # the three releases before the newest of the others, one batch
    runs-on: ubuntu-latest
    outputs:
      oldest: ${{ steps.pick.outputs.oldest }}
      newest: ${{ steps.pick.outputs.newest }}
      batches: ${{ steps.pick.outputs.batches }}
    steps:
      - id: pick
        env:
          ALL: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-') }}
          # at most this many releases per batch job (about 30 s each, three at a time: 18 take about 4 minutes)
          PER_BATCH: 18
        run: |
          read -ra r <<< "$UPGRADE_FROM"
          n=${#r[@]}
          if [ "$ALL" = true ]; then others=("${r[@]:1:n-2}"); else others=("${r[@]:n-4:3}"); fi
          m=${#others[@]}
          k=$(( (m + PER_BATCH - 1) / PER_BATCH ))
          size=$(( (m + k - 1) / k ))
          {
            echo "oldest=${r[0]}"
            echo "newest=${r[n-1]}"
            echo "batches=$( for ((i = 0; i < m; i += size)); do
                               b=("${others[@]:i:size}")
                               jq -nc --arg first "${b[0]}" --arg last "${b[-1]}" --arg releases "${b[*]}" \
                                 '{first: $first, last: $last, releases: $releases}'
                             done | jq -sc '{include: .}')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Install an older release with its sample data, upgrade to this commit, then run the tests: migrations must work on
  # existing databases too. The whole suite runs (in three shards) after upgrading from the oldest and the newest
  # release; the others run the tests that touch every table (QUICK_TESTS: export / import, the CLI, generated apps,
  # sign-in), so dozens of copies of the suite don't each get a chance to hit a timing flake. The oldest and the newest
  # are two jobs with the same steps (the YAML anchors), so that each one's required check waits only for its own shards.
  upgrade-oldest:
    name: upgrade (${{ matrix.from }}, shard ${{ matrix.shard }}/3)
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: ['${{ needs.releases.outputs.oldest }}']
        shard: [1, 2, 3]
    services: &upgrade-services
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgkiln
          POSTGRES_PASSWORD: pgkiln
          POSTGRES_DB: pgkiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgkiln"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &upgrade-env
      DATABASE_URL: postgres://pgkiln:pgkiln@localhost:5432/pgkiln
      RUNTIME_DATABASE_URL: postgres://pgkiln_runtime:pgkiln_runtime@localhost:5432/pgkiln
      API_JWT_SECRET: ci-only-api-secret-not-for-production-0123456789
    steps: &upgrade-suite-steps
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.from }}
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          # the whole release: its migrations and its HR example
          git archive "${{ matrix.from }}" | tar -x -C "$RUNNER_TEMP/old"
          npx tsx scripts/migrate.ts --seed --root "$RUNNER_TEMP/old"
      - name: Upgrade to this commit
        run: npm run example:hr
      # the whole suite (npm test), a third of it
      - name: Tests (shard ${{ matrix.shard }}/3)
        run: |
          npm run pretest
          npx tsx --test --test-concurrency=1 $(npx tsx scripts/test-shard.ts ${{ matrix.shard }}/3 test/*.test.ts)

  upgrade-newest:
    name: upgrade (${{ matrix.from }}, shard ${{ matrix.shard }}/3)
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: ['${{ needs.releases.outputs.newest }}']
        shard: [1, 2, 3]
    services: *upgrade-services
    env: *upgrade-env
    steps: *upgrade-suite-steps

  upgrade-batch:
    # the other releases, a batch per job: each gets a fresh PostgreSQL container of its own (no service: a service
    # lives as long as the job), the old release installed, the upgrade and QUICK_TESTS. (sprint 212) PARALLEL of them
    # at a time, each on its own port (the runner has four cores; a release takes ~30 s, most of it QUICK_TESTS). A
    # failing release doesn't stop the batch; the job prints each release's output in a group and fails at the end,
    # listing the releases that failed
    name: upgrade (${{ matrix.first }} … ${{ matrix.last }})
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.batches) }}
    # (sprint 216) a hang must not hold a runner for six hours
    timeout-minutes: 30
    env:
      API_JWT_SECRET: ci-only-api-secret-not-for-production-0123456789
      QUICK_TESTS: test/cli.test.ts test/export.test.ts test/generated-apps.test.ts test/builder-home.test.ts test/mfa.test.ts
      RELEASES: ${{ matrix.releases }}
      PARALLEL: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker pull -q postgres:17
      - name: Upgrade from ${{ matrix.releases }}
        run: |
          out="$RUNNER_TEMP/upgrades"
          mkdir -p "$out"
          # one release on its own database (port 5440 + slot): the old release, the upgrade, QUICK_TESTS
          upgrade() {
            local from=$1 port=$((5440 + $2)) start=$SECONDS
            export DATABASE_URL=postgres://pgkiln:pgkiln@localhost:$port/pgkiln
            export RUNTIME_DATABASE_URL=postgres://pgkiln_runtime:pgkiln_runtime@localhost:$port/pgkiln
            docker rm -f "pg$port" >/dev/null 2>&1 || true
            # a throwaway database: in memory, without fsync (three of them write at once)
            docker run -d --name "pg$port" -p "$port:5432" -e POSTGRES_USER=pgkiln -e POSTGRES_PASSWORD=pgkiln \
              -e POSTGRES_DB=pgkiln --tmpfs /var/lib/postgresql/data:rw,size=2g postgres:17 \
              -c fsync=off -c synchronous_commit=off -c full_page_writes=off >/dev/null
            # pg_isready answers during the image's initdb too (on a socket only): wait for TCP and a query
            for i in $(seq 1 60); do psql "$DATABASE_URL" -qtAc 'select 1' >/dev/null 2>&1 && break; sleep 0.5; done
            local old="$RUNNER_TEMP/old-$from"
            mkdir -p "$old"
            if git archive "$from" | tar -x -C "$old" \
               && npx tsx scripts/migrate.ts --seed --root "$old" \
               && npm run example:hr \
               && npx tsx --test --test-concurrency=1 $QUICK_TESTS; then
              echo "upgrade from $from: ok ($((SECONDS - start)) s)"
            else
              echo "upgrade from $from: failed ($((SECONDS - start)) s)"
              touch "$out/$from.failed"
            fi
            docker rm -f "pg$port" >/dev/null 2>&1 || true
          }
          read -ra rs <<< "$RELEASES"
          export -f upgrade
          export out
          # slot j takes releases j, j + PARALLEL, ...; (sprint 216) each release at most 6 minutes (they take about
          # one): a hang kills that release only, with the processes and containers at that moment in its log
          for ((j = 0; j < PARALLEL; j++)); do
            ( for ((i = j; i < ${#rs[@]}; i += PARALLEL)); do
                echo "$(date +%T) slot $j: upgrade from ${rs[i]} …"
                # a snapshot shortly before the limit, while a hung process is still there
                ( sleep 330; { ps -eo pid,ppid,etimes,args --forest; docker ps --format '{{.Names}} {{.Status}}'; } > "$out/${rs[i]}.ps" 2>&1 ) &
                watcher=$!
                timeout -k 10 360 bash -c 'upgrade "$1" "$2"' _ "${rs[i]}" "$j" < /dev/null > "$out/${rs[i]}.log" 2>&1
                rc=$?
                kill $watcher 2> /dev/null || true
                if [ $rc -ge 124 ]; then
                  { echo "processes and containers at 330 s:"; cat "$out/${rs[i]}.ps"
                    echo "upgrade from ${rs[i]}: timed out after 360 s (exit $rc)"; } >> "$out/${rs[i]}.log" 2>&1
                  touch "$out/${rs[i]}.failed"
                  docker rm -f "pg$((5440 + j))" > /dev/null 2>&1 || true
                fi
                echo "$(date +%T) slot $j: $(tail -n 1 "$out/${rs[i]}.log")"
              done ) &
          done
          wait
          failed=()
          for from in "${rs[@]}"; do
            echo "::group::$(tail -n 1 "$out/$from.log")"
            cat "$out/$from.log"
            echo "::endgroup::"
            if [ -e "$out/$from.failed" ]; then failed+=("$from"); echo "::error::upgrade from $from failed"; fi
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "failed: ${failed[*]}"; exit 1; fi

  # required check "upgrade (v0.31.0)" (and its twin for the newest release): the three shards of the whole suite after
  # upgrading from that release passed; each waits only for its own shards, not for the batches
  upgrade-oldest-result:
    name: upgrade (${{ needs.releases.outputs.oldest }})
    needs: [releases, upgrade-oldest]
    if: always() && needs.releases.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.upgrade-oldest.result }}" = success ]'

  upgrade-newest-result:
    name: upgrade (${{ needs.releases.outputs.newest }})
    needs: [releases, upgrade-newest]
    if: always() && needs.releases.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.upgrade-newest.result }}" = success ]'

  docker:
    # what a user runs: deploy/.env.example filled in, docker compose up -d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start with the example .env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/; s/^RUNTIME_PASSWORD=$/RUNTIME_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^PGKILN_SECRET_KEY=$/PGKILN_SECRET_KEY=$(openssl rand -hex 24)/; s/^PGKILN_ADMIN_PASSWORD=$/PGKILN_ADMIN_PASSWORD=ci-admin-password-0123/" .env
          echo PGKILN_EXAMPLE=hr >> .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Check it
        run: |
          curl -fsS http://127.0.0.1:3100/healthz
          curl -fsS -o /dev/null http://127.0.0.1:3100/a/hr/login
          curl -fsS -o /dev/null http://127.0.0.1:3100/builder/login
      - name: pg_cron works (SQL Workshop › Scheduling)
        working-directory: deploy
        run: ../scripts/check-compose-pgcron.sh
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs

  docker-upgrade:
    # what a user runs to upgrade: docker compose pull, then docker compose up -d. An older release stands in for
    # a stale :latest; the pull must replace it (it didn't with pull_policy: missing) and up -d must recreate the
    # container on the new image, which migrates the database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start an older release as :latest
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/; s/^RUNTIME_PASSWORD=$/RUNTIME_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^PGKILN_SECRET_KEY=$/PGKILN_SECRET_KEY=$(openssl rand -hex 24)/; s/^PGKILN_ADMIN_PASSWORD=$/PGKILN_ADMIN_PASSWORD=ci-admin-password-0123/" .env
          echo PGKILN_EXAMPLE=hr >> .env
          docker pull pgkiln/pgkiln:0.50.0
          docker tag pgkiln/pgkiln:0.50.0 pgkiln/pgkiln:latest
          docker compose up -d --wait --wait-timeout 300
      - name: Upgrade with docker compose pull
        working-directory: deploy
        run: |
          old=$(docker image inspect -f '{{.Id}}' pgkiln/pgkiln:0.50.0)
          docker compose pull pgkiln
          new=$(docker image inspect -f '{{.Id}}' pgkiln/pgkiln:latest)
          [ "$new" != "$old" ] || { echo "docker compose pull kept the old image"; exit 1; }
          docker compose up -d --wait --wait-timeout 300
          [ "$(docker inspect -f '{{.Image}}' "$(docker compose ps -q pgkiln)")" = "$new" ] || { echo "the container still runs the old image"; exit 1; }
          curl -fsS http://127.0.0.1:3100/healthz
          curl -fsS -o /dev/null http://127.0.0.1:3100/a/hr/login
      # 0.50.0 didn't create pg_cron; the published :latest (0.106.0 or later) does, on the database compose.yaml builds
      - name: pg_cron works after the upgrade
        working-directory: deploy
        run: ../scripts/check-compose-pgcron.sh
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs
