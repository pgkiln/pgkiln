name: Publish to npm

# A release tag (v0.31.0, …) publishes the package `pgkiln` to npm with trusted publishing:
# npm checks GitHub's identity token for this repository and workflow, so no npm token is
# stored here, and the package gets a provenance statement. Set up once on npmjs.com:
# package pgkiln → Settings → Trusted Publisher → GitHub Actions, organization pgkiln,
# repository pgkiln, workflow npm-publish.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the identity token npm checks

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@11
      - name: Check the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${version}"; exit 1
          fi
          if npm view "pgkiln@${version}" version >/dev/null 2>&1; then
            echo "pgkiln ${version} is already on npm"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip != 'true'
        run: npm publish --access public
